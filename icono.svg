<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="fondo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b2f57"/>
      <stop offset="1" stop-color="#1769c4"/>
    </linearGradient>
    <linearGradient id="torre" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#cfe0f5"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#fondo)"/>
  <!-- suelo -->
  <rect x="84" y="392" width="344" height="14" rx="7" fill="#ffffff" opacity=".3"/>
  <!-- torres que crecen (como el gráfico 3D de la app) -->
  <rect x="96" y="296" width="62" height="96" rx="10" fill="url(#torre)"/>
  <rect x="96" y="296" width="62" height="20" rx="8" fill="#f59e0b"/>
  <rect x="174" y="236" width="62" height="156" rx="10" fill="url(#torre)"/>
  <rect x="174" y="236" width="62" height="20" rx="8" fill="#f59e0b"/>
  <rect x="252" y="176" width="62" height="216" rx="10" fill="url(#torre)"/>
  <rect x="252" y="176" width="62" height="20" rx="8" fill="#f59e0b"/>
  <!-- lupa con visto bueno -->
  <path d="M410 196 L446 232" stroke="#f59e0b" stroke-width="36" stroke-linecap="round"/>
  <circle cx="372" cy="150" r="60" fill="#0f4c8f" stroke="#ffffff" stroke-width="22"/>
  <path d="M344 152 l20 20 l36 -40" fill="none" stroke="#f59e0b" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
